# 레거시 사이트 통합 테스트: PHP 5.6(현재 운영) → PHP 8.3(마이그레이션 목표)
services:
  db:
    image: mariadb:10.6
    command: ["--character-set-server=latin1", "--collation-server=latin1_swedish_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: zbdb
      MARIADB_USER: zbuser
      MARIADB_PASSWORD: zbpass123
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
  php56:
    build: { context: ., dockerfile: Dockerfile.php56 }
    depends_on: [db]
    volumes:
      - ${SITE_DIR}:/var/www/html
      - ../../..:/opt/webguard:ro
      - ./php56-legacy.ini:/usr/local/etc/php/conf.d/legacy.ini:ro
  php83:
    build: { context: ., dockerfile: Dockerfile.php83 }
    depends_on: [db]
    volumes:
      - ${SITE_DIR}:/var/www/html
